name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs share the per-day revision counter, so never let two compute it at once.
concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: write # push the version tag
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # yyyy.MM.dd.Rev — Rev counts releases on that UTC day, taken from existing git tags.
      - name: Compute version
        id: version
        run: |
          day=$(date -u +%Y.%m.%d)
          last=$(git tag -l "$day.*" | sed "s/^$day\.//" | sort -n | tail -1)
          echo "version=$day.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
