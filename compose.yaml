# One Deckhand node. Run it on each server, then add each one as an environment in the
# dashboard you use. Set DECKHAND_TOKEN: the port is reachable from other machines.
services:
  deckhand:
    build: .
    # image: ghcr.io/<you>/deckhand:latest
    ports:
      - '4800:4800'
    volumes:
      - deckhand:/data
      # Needed only for `ref: docker:...` MCP servers from the Docker MCP catalog.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DECKHAND_TOKEN: ${DECKHAND_TOKEN:?set DECKHAND_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    restart: unless-stopped

volumes:
  deckhand:
