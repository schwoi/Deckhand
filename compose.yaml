# One Deckhand node. Run it on each server, then add each one as an environment in the
# dashboard you use. Set DECKHAND_TOKEN: the port is reachable from other machines.
# Pin a release (e.g. :2026.10.13.1) instead of :latest for reproducible deploys.
# To build from source instead, use compose.dev.yaml.
services:
  deckhand:
    image: ghcr.io/schwoi/deckhand:latest
    ports:
      - '4800:4800'
    volumes:
      - deckhand:/data
      # Needed only for `ref: docker:...` MCP servers from the Docker MCP catalog.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DECKHAND_TOKEN: ${DECKHAND_TOKEN:?set DECKHAND_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    restart: unless-stopped

volumes:
  deckhand:
